# Deploy no Fly.io (região São Paulo). SQLite mora no volume /data.
# IMPORTANTE: rode UMA máquina só (o banco e o barramento ao vivo são locais).
app = "arquibancada"
primary_region = "gru"

[env]
  DATABASE_URL = "file:/data/arquibancada.db"
  PORT = "3000"
  WEB_ORIGIN = "https://arquibancada.fly.dev"

[[mounts]]
  source = "arquibancada_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 8000
    hard_limit = 10000

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
